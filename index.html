    body {

    /* Subtle Knit Stitch Background Pattern */
    .knit-bg {
      background-image: radial-gradient(rgba(90, 14, 23, 0.08) 1px, transparent 1px),

    /* Bento Card Hover Polish */
    .bento-card {
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);

    .bento-card:hover {
      transform: translateY(-4px);

    }

    /* Floating Yarn Threads Animation */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(3deg); }
    }
    .animate-float-slow {
      animation: floatSlow 7s ease-in-out infinite;
    }
    .animate-float-delayed {
      animation: floatSlow 9s ease-in-out 2s infinite;
    }

    /* Scroll Reveal */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }
